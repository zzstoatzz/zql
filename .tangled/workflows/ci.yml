when:
  - event: ["push", "pull_request"]
    branch: main

engine: nixery

dependencies:
  nixpkgs:
    - coreutils
    - curl
    - gnutar
    - xz

steps:
  - name: install pinned zig
    command: scripts/ci-zig.sh /tangled/workspace/.zig

  - name: check formatting
    command: |
      /tangled/workspace/.zig/zig fmt --check .

  - name: run tests
    command: |
      /tangled/workspace/.zig/zig build test --summary all
